name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run unit & i18n parity tests
        run: |
          node --test tests/*.test.cjs

  build:
    name: Build & Store Pre-flight
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build extension packages
        run: ./scripts/build.sh

      - name: Validate generated archives
        run: |
          set -e

          for zip in dist/*.zip; do
            echo "Checking $zip"
            unzip -t "$zip"
          done

          for zip in dist/*-firefox.zip dist/*-chromium.zip dist/*-opera.zip; do
            echo "Checking required files in $zip"
            unzip -l "$zip" | grep -q "manifest.json"
            unzip -l "$zip" | grep -q "background.js"
          done

      - name: Run Mozilla Add-ons linter on Firefox package
        run: |
          npx --yes addons-linter dist/*-firefox.zip --output=text

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockedin-extension-packages
          path: dist/*.zip
          retention-days: 14

  pr-summary:
    name: PR Build Summary
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const commentHeader = '### 🧪 LockedIn CI Build & Validation Status';
            const body = `${commentHeader}

            ✅ **All checks passed successfully!**
            - **Syntax & Unit Tests**: \`node --check\` and all test suites in \`tests/\` passed.
            - **i18n Parity**: All 8 supported languages validated.
            - **Store Pre-flight**: Firefox package passed Mozilla \`addons-linter\` with 0 errors.
            - **Build Packages**: Firefox, Chrome/Edge, Opera, and Source ZIPs generated.

            #### 📦 Download & Test This Build
            Artifacts are available in the **Artifacts** section of this run:
            👉 [View and download build artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            *Commit:* \`${context.sha.substring(0, 7)}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(commentHeader)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
