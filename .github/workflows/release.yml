name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3

      - name: Determine release version & check if already released
        id: check_version
        run: |
          git fetch --tags origin || true

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -e "console.log(require('./src/manifest.json').version)")
          fi

          TAG="v${VERSION}"
          echo "Target version: $VERSION"
          echo "Target tag:     $TAG"

          # Check if tag already exists in repo history
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF}" != refs/tags/* ]] && [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "Tag $TAG already exists on repository. Skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate formatted release notes
        if: steps.check_version.outputs.should_release == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-release-notes.js "${{ steps.check_version.outputs.version }}"

      - name: Make build script executable
        if: steps.check_version.outputs.should_release == 'true'
        run: chmod +x scripts/build.sh

      - name: Build extension packages
        if: steps.check_version.outputs.should_release == 'true'
        run: ./scripts/build.sh

      - name: Validate release artifacts
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -e

          version="${{ steps.check_version.outputs.version }}"
          expected=(
            "dist/lockedin-v${version}-firefox.zip"
            "dist/lockedin-v${version}-chromium.zip"
            "dist/lockedin-v${version}-opera.zip"
            "dist/lockedin-v${version}-source.zip"
          )

          for zip in "${expected[@]}"; do
            test -s "$zip"
            echo "Validating $zip"
            unzip -t "$zip"
          done

          for zip in "${expected[0]}" "${expected[1]}" "${expected[2]}"; do
            unzip -l "$zip" | grep -q "manifest.json"
            unzip -l "$zip" | grep -q "background.js"
            archive_version=$(unzip -p "$zip" manifest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
            test "$archive_version" = "$version"
          done

      - name: Run Mozilla Add-ons linter on Firefox package
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          npx --yes addons-linter "dist/lockedin-v${{ steps.check_version.outputs.version }}-firefox.zip" --output=text

      - name: Generate SHA256 checksums
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Tag commit (if triggered from branch)
        if: steps.check_version.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git rev-parse "${{ steps.check_version.outputs.tag }}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${{ steps.check_version.outputs.tag }}" -m "LockedIn ${{ steps.check_version.outputs.tag }}"
            git push origin "${{ steps.check_version.outputs.tag }}"
          fi

      - name: Create GitHub Release
        if: steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: LockedIn ${{ steps.check_version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/lockedin-${{ steps.check_version.outputs.tag }}-firefox.zip
            dist/lockedin-${{ steps.check_version.outputs.tag }}-chromium.zip
            dist/lockedin-${{ steps.check_version.outputs.tag }}-opera.zip
            dist/lockedin-${{ steps.check_version.outputs.tag }}-source.zip
            dist/SHA256SUMS.txt
